[project]
name = "aap_example"
version = "0.2.0"
description = "Notebook example for aap framework"
readme = "README.md"
license = { text = "MIT" }
keywords = ["agent", "ai", "pattern", "llm", "dspy"]
authors = [
    { name = "Ly Hon Quang", email = "lyhonquang@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aap_langchain>=0.1.0",
    "aap_llamaindex>=0.1.0",
    "aap_dspy>=0.1.0",
    "aap_transformers>=0.1.0",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Pydantic :: 2",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/quanghona/aap_example.git"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
lint = [
    "ruff==0.14.0",
]
